<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work — NOAH Creative Marketing Studio</title>
<link rel="stylesheet" href="ds/tokens/fonts.css">
<link rel="stylesheet" href="ds/tokens/colors.css">
<link rel="stylesheet" href="ds/tokens/typography.css">
<link rel="stylesheet" href="ds/tokens/spacing.css">
<link rel="stylesheet" href="ds/tokens/radius-shadow.css">
<link rel="stylesheet" href="ds/tokens/motion.css">
<link rel="stylesheet" href="ds/tokens/motifs.css">
<link rel="stylesheet" href="ds/tokens/base.css">
<link rel="stylesheet" href="ds/styles.css">
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/lucide.min.js"></script>
<script src="ds/ds-bundle.js"></script>
<script src="image-slot.js"></script>
<style>
body{margin:0;background:var(--grey-50,#F6F7F9);font-family:var(--font-latin,'Montserrat',sans-serif);overflow-x:hidden}
a{color:var(--noah-blue,#1464F0);text-decoration:none}
a:hover{color:var(--blue-600,#08296B)}
.dotbg{background-image:radial-gradient(circle,rgba(8,41,107,.10) 1px,transparent 1.4px);background-size:26px 26px}
.toolbar{position:fixed;top:16px;left:0;right:0;z-index:60;display:flex;justify-content:center;pointer-events:none}
.toolbar-in{pointer-events:auto;display:flex;align-items:center;gap:26px;padding:11px 22px;border-radius:999px;background:var(--surface-glass,rgba(255,255,255,.72));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(8,41,107,.08);transition:box-shadow .24s var(--ease-out,ease),background .24s var(--ease-out,ease)}
.toolbar.scrolled .toolbar-in{background:rgba(255,255,255,.88);box-shadow:0 12px 32px rgba(8,41,107,.12)}
.tb-nav{display:flex;gap:22px;margin-left:6px}
.tb-nav a{font-size:13px;font-weight:600;color:var(--grey-700,#414753)}
.tb-nav a:hover{color:var(--noah-blue,#1464F0)}
.tb-work{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;margin:-7px -8px -7px 0;border-radius:999px;background:var(--noah-blue,#1464F0);color:#fff !important;box-shadow:0 6px 16px rgba(20,100,240,.28);transition:all .16s var(--ease-out,ease)}
.tb-work:hover{background:var(--blue-600,#08296B);transform:translateY(-1px)}
.tb-work .tb-arr{font-size:11px;color:var(--noah-yellow,#FFF145)}
.wk-cats{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px}
.wk-pill{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;border:1px solid var(--grey-200,#E4E6EA);background:#fff;color:var(--grey-700,#414753);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .16s var(--ease-out,ease)}
.wk-pill i{font-style:normal;font-size:11px;font-weight:700;color:var(--grey-400,#AFB4BF)}
.wk-pill:hover{border-color:var(--noah-blue,#1464F0);color:var(--noah-blue,#1464F0)}
.wk-pill.on{background:var(--noah-blue,#1464F0);border-color:var(--noah-blue,#1464F0);color:#fff;box-shadow:0 10px 24px rgba(20,100,240,.24)}
.wk-pill.on i{color:var(--noah-yellow,#FFF145)}
.wk-pill:active{transform:scale(.97)}
.wk-subs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:16px;animation:subIn .42s var(--ease-out,cubic-bezier(.16,1,.3,1)) both}
@keyframes subIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wk-subhint{display:inline-flex;color:var(--grey-400,#AFB4BF);margin-right:4px}
.wk-sub{padding:8px 15px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--grey-500,#858B99);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .16s var(--ease-out,ease)}
.wk-sub:hover{color:var(--noah-blue,#1464F0);background:var(--blue-50,#E7F0FE)}
.wk-sub.on{background:var(--blue-50,#E7F0FE);color:var(--noah-blue,#1464F0);border-color:rgba(20,100,240,.28)}
.wk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 24px;align-items:start}
.wk-grid-2{grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
.wk-card{break-inside:avoid;cursor:pointer;animation:cardIn .42s var(--ease-out,cubic-bezier(.16,1,.3,1)) both}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.wk-media{position:relative;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(8,41,107,.08);transition:transform .24s var(--ease-out,ease),box-shadow .24s var(--ease-out,ease)}
.wk-card:hover .wk-media{transform:translateY(-4px);box-shadow:0 20px 48px rgba(8,41,107,.14)}
.wk-media img,.wk-media video{transition:transform .45s cubic-bezier(.16,1,.3,1)}
.wk-card:hover .wk-media img,.wk-card:hover .wk-media video{transform:scale(1.03)}
.wk-media image-slot{position:absolute;inset:0}
.ph-stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle,rgba(8,41,107,.08) 1px,transparent 1.4px) 0 0/18px 18px,radial-gradient(75% 55% at 50% 80%,rgba(20,100,240,.20),transparent 72%),linear-gradient(172deg,#F5F8FF 0%,var(--blue-50,#E7F0FE) 100%)}
.ph{position:absolute;left:50%;top:10%;width:66%;padding:1.9%;box-sizing:border-box;border-radius:16.67%/7.93%;background:#0D1017;box-shadow:inset 0 0 0 2px #343A47,0 18px 36px -12px rgba(8,41,107,.42);transform:translateX(-50%);transition:transform .45s cubic-bezier(.16,1,.3,1)}
.ph::before,.ph::after{content:"";position:absolute;width:1.1%;background:#2A2F3A}
.ph::before{left:-.8%;top:21%;height:15%;border-radius:2px 0 0 2px;background:linear-gradient(#2A2F3A 0 44%,transparent 44% 56%,#2A2F3A 56%)}
.ph::after{right:-.8%;top:27%;height:10%;border-radius:0 2px 2px 0}
.ph-screen{position:relative;width:100%;aspect-ratio:1179/2556;border-radius:14.63%/6.75%;overflow:hidden;background:#fff;transform:translateZ(0)}
.ph-screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.ph-island{position:absolute;left:50%;top:1.3%;width:31%;aspect-ratio:126/37;border-radius:999px;background:#05070B;transform:translateX(-50%);z-index:2;pointer-events:none}
.wk-card:hover .wk-media .ph-screen img{transform:none}
.wk-card:hover .ph{transform:translate(-50%,-2.2%)}
.wk-go{position:absolute;bottom:14px;right:14px;z-index:5;width:40px;height:40px;border-radius:50%;background:var(--noah-blue,#1464F0);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(8px);transition:all .24s var(--ease-out,ease);pointer-events:none}
.wk-card:hover .wk-go{opacity:1;transform:none}
.wk-play{position:absolute;top:12px;left:12px;z-index:4;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(8,41,107,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;transition:opacity .2s var(--ease-out,ease)}
.wk-card:hover .wk-play{opacity:0}
.wk-card.has-deck .wk-go{background:var(--noah-yellow,#FFF145);color:var(--blue-600,#08296B)}
.dk-scrim{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:dkIn .24s var(--ease-out,ease) both}
@keyframes dkIn{from{opacity:0}to{opacity:1}}
.dk-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 0 0}
.dk-head{max-width:1100px;margin:0 auto;padding:84px 24px 24px;text-align:center;color:#fff}
.dk-head h2{margin:0;font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.03em;color:#fff}
.dk-head p{margin:8px 0 0;font-size:14px;font-weight:600;color:rgba(255,255,255,.72)}
.dk-pages{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:0;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:dkRise .42s var(--ease-out,cubic-bezier(.16,1,.3,1)) both}
@keyframes dkRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.dk-pages img{display:block;width:100%;height:auto;margin:0;vertical-align:top}
.dk-foot{max-width:1100px;margin:0 auto;padding:28px 24px 96px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dk-foot span{font-size:13px;font-weight:600;color:rgba(255,255,255,.6)}
.dk-foot a{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;background:var(--noah-blue,#1464F0);color:#fff !important;font-size:14px;font-weight:600}
.dk-foot a:hover{background:var(--blue-600,#08296B)}
.dk-x{position:fixed;top:22px;right:26px;z-index:210;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .16s var(--ease-out,ease)}
.dk-x:hover{background:#fff;color:var(--blue-600,#08296B)}
.pl-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:80px 24px 40px;box-sizing:border-box}
.pl-frame{width:min(1100px,100%);max-height:100%;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:dkRise .42s var(--ease-out,cubic-bezier(.16,1,.3,1)) both}
.pl-frame.tall{width:auto;height:min(74vh,900px)}
.pl-frame iframe,.pl-frame video{display:block;width:100%;height:100%;border:0;background:#000}
.pl-meta{text-align:center;flex:none}
.pl-meta h2{margin:0;font-size:clamp(20px,2.4vw,28px);font-weight:700;letter-spacing:-.02em;color:#fff}
.pl-meta p{margin:6px 0 0;font-size:13px;font-weight:600;color:rgba(255,255,255,.62)}
@media (max-width:700px){.dk-head{padding-top:72px}.dk-pages{border-radius:12px}}
.wk-meta{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-top:12px}
.wk-meta h3{margin:0;font-size:16.5px;font-weight:600;color:var(--blue-600,#08296B);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-meta p{margin:3px 0 0;font-size:12.5px;font-weight:600;color:var(--grey-500,#858B99)}
.wk-yr{font-size:12px;font-weight:600;color:var(--grey-400,#AFB4BF);flex:none}
.cl-head{margin:24px 0 32px;font-size:clamp(24px,3vw,34px);font-weight:700;letter-spacing:-.03em;color:var(--blue-600,#08296B)}
.cl-head span{display:block;margin-top:8px;font-family:var(--font-cn-mid,sans-serif);font-size:15px;font-weight:500;color:var(--grey-500,#858B99);letter-spacing:0}
.cl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.cl-cell{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 14px rgba(8,41,107,.07);aspect-ratio:1/1;display:grid;place-items:center;transition:transform .24s var(--ease-out,ease),box-shadow .24s var(--ease-out,ease)}
.cl-cell:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(8,41,107,.13)}
.cl-cell img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:560px){.cl-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
.wk-cta{display:inline-flex;align-items:center;gap:10px;padding:16px 32px;border-radius:999px;background:#fff;color:var(--blue-600,#08296B);font-size:15px;font-weight:600;transition:all .16s var(--ease-out,ease)}
.wk-cta:hover{background:var(--noah-yellow,#FFF145);color:var(--blue-600,#08296B);transform:translateY(-2px)}
@media (max-width:760px){.wk-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.wk-grid,.wk-grid-2{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}.wk-meta h3{font-size:14px}.wk-meta p{font-size:11.5px}.wk-yr{display:none}
.toolbar{top:10px}.toolbar-in{gap:14px;padding:9px 14px}.tb-nav{gap:14px}.tb-nav a{font-size:12.5px}.tb-work{padding:7px 12px;margin-right:-6px}
.wk-hero{padding:112px 20px 28px !important}.wk-hero h1{font-size:clamp(40px,12vw,52px) !important}.wk-hero p{font-size:20px !important}
.wk-cats,.wk-subs{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;margin-left:-20px;margin-right:-20px;padding:6px 20px 10px;scroll-padding-left:20px;-webkit-overflow-scrolling:touch;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 28px),transparent)}
.wk-cats::-webkit-scrollbar,.wk-subs::-webkit-scrollbar{display:none}
.wk-cats{gap:8px;margin-top:22px}.wk-pill{flex:none;white-space:nowrap;padding:9px 14px;font-size:12.5px;gap:6px}.wk-pill.on{box-shadow:0 6px 14px rgba(20,100,240,.22)}
.wk-subs{gap:4px;margin-top:2px;padding-top:0}.wk-sub{flex:none;white-space:nowrap;padding:7px 12px;font-size:12px}.wk-subhint{flex:none}
.wk-body{padding:4px 20px 64px !important}.wk-media{border-radius:14px}.wk-go{display:none}
.cl-head{font-size:24px}.cl-head span{font-size:13px}
.wk-cta-sec{padding:56px 22px !important}.wk-cta-sec h2{font-size:30px !important}.wk-cta-sec p{font-size:16px !important}.wk-cta{padding:14px 24px;font-size:14px}
.dk-head{padding:64px 16px 16px}.dk-head h2{font-size:24px}.dk-head p{font-size:12.5px}.dk-pages{margin:0 10px;border-radius:12px}.dk-foot{padding:22px 16px 72px}.dk-x{top:14px;right:14px;width:40px;height:40px}
.pl-wrap{padding:70px 14px 28px;gap:14px}.pl-frame.tall{height:min(66vh,760px)}.pl-meta h2{font-size:18px}.pl-meta p{font-size:12px}
footer{padding:48px 22px 24px !important}footer>div[style*="grid"]{grid-template-columns:1fr 1fr !important;gap:28px 20px !important}footer>div[style*="grid"]>div:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<div id="root"></div>
<script src="work.js"></script>
</body>
</html>
